name: Verify plugins
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install pytest beautifulsoup4
      - run: python -m compileall -q plugins.v3
      - run: python scripts/check_release.py
      - run: python tests/v3/doubanwatchsync/run_isolated.py
      - run: python tests/v3/tguniversalsign/run_isolated.py
      - run: node tests/v3/doubanwatchsync/frontend.mjs
      - run: git diff --check
