name: Verify plugins
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - run: python -m pip install pytest beautifulsoup4 Pillow
      - run: python -m compileall -q plugins.v2 plugins.v3
      - run: python scripts/check_release.py
      - run: python tests/v2/doubanwatchsync/run_isolated.py
      - run: python tests/v3/doubanwatchsync/run_isolated.py
      - run: python tests/v3/tguniversalsign/run_isolated.py
      - run: node tests/v2/doubanwatchsync/frontend.mjs
      - run: node tests/v3/doubanwatchsync/frontend.mjs
      - run: node tests/v3/tguniversalsign/frontend.mjs
      - run: git diff --check
